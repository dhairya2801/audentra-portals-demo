apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audentra-portals-web-ingress
  labels:
    app.kubernetes.io/name: audentra-portals
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audentra-portals
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: http
