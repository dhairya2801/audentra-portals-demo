name: audentra-portals-preview

services:
  web:
    image: ${PORTALS_IMAGE_URI}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000').then(response => {
          if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    pids_limit: 128
    mem_limit: 224m
    networks:
      - preview

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      SITE_HOST: ${SITE_HOST}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:2019/config/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    pids_limit: 64
    mem_limit: 64m
    networks:
      - preview

volumes:
  caddy-data:
    name: vv-edgent-preview_caddy-data
  caddy-config:
    name: vv-edgent-preview_caddy-config

networks:
  preview:
    name: audentra-preview
    external: true
