<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="A phone held in a hand showing a rising yield chart">
  <defs>
    <linearGradient id="ys-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f44"/>
      <stop offset="1" stop-color="#16306b"/>
    </linearGradient>
    <linearGradient id="ys-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <linearGradient id="ys-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a38ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6a38ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#ys-bg)"/>
  <circle cx="316" cy="52" r="92" fill="#6a38ff" opacity="0.28"/>
  <circle cx="72" cy="228" r="70" fill="#00c49a" opacity="0.18"/>

  <!-- phone -->
  <g transform="rotate(-8 200 140)">
    <rect x="140" y="42" width="122" height="212" rx="20" fill="#0a1f44"/>
    <rect x="146" y="48" width="110" height="200" rx="15" fill="url(#ys-screen)"/>
    <rect x="182" y="56" width="38" height="6" rx="3" fill="#0a1f44" opacity="0.35"/>

    <!-- screen header -->
    <rect x="158" y="76" width="42" height="6" rx="3" fill="#c3cbdb"/>
    <rect x="158" y="90" width="66" height="12" rx="4" fill="#0a1f44"/>
    <g>
      <path d="M232 92 l6 -8 l6 8 z" fill="#00c49a"/>
      <rect x="230" y="94" width="16" height="5" rx="2.5" fill="#00c49a" opacity="0.45"/>
    </g>

    <!-- chart -->
    <path d="M158 178 L176 166 L192 170 L208 150 L226 136 L244 116 L244 190 L158 190 Z" fill="url(#ys-fill)"/>
    <path d="M158 178 L176 166 L192 170 L208 150 L226 136 L244 116" fill="none" stroke="#6a38ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="244" cy="116" r="6" fill="#ffffff" stroke="#6a38ff" stroke-width="4"/>
    <g fill="#dde3ee">
      <rect x="158" y="198" width="86" height="4" rx="2"/>
      <rect x="158" y="210" width="62" height="4" rx="2"/>
    </g>
    <rect x="158" y="224" width="86" height="14" rx="7" fill="#1e5bff"/>
  </g>

  <!-- hand -->
  <g fill="#e8b98f">
    <path d="M96 258 v-58 a16 16 0 0 1 32 0 v22 l26 -8 a11 11 0 0 1 7 21 l-6 2 12 -2 a11 11 0 0 1 3 22 l-10 2 8 0 a10 10 0 0 1 1 20 l-14 3 v-4 a10 10 0 0 1 -3 20 l-56 0 z"/>
  </g>
  <path d="M96 258 v-58 a16 16 0 0 1 32 0 v22" fill="none" stroke="#d3a37a" stroke-width="2" opacity="0.7"/>
</svg>
