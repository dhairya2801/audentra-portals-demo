<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="An open notebook on a desk beside a coffee cup, with an enrollment chart on the page">
  <defs>
    <linearGradient id="et-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e6dccc"/>
    </linearGradient>
    <linearGradient id="et-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f4f8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#et-bg)"/>
  <ellipse cx="196" cy="214" rx="150" ry="20" fill="#0a1f44" opacity="0.07"/>

  <!-- notebook -->
  <g transform="rotate(-4 190 140)">
    <rect x="52" y="72" width="276" height="136" rx="8" fill="#0a1f44" opacity="0.12"/>
    <rect x="48" y="66" width="276" height="136" rx="8" fill="url(#et-page)"/>
    <rect x="182" y="66" width="8" height="136" fill="#dfe4ee"/>
    <!-- left page: ruled lines -->
    <g fill="#c9d1de">
      <rect x="68" y="90" width="94" height="4" rx="2"/>
      <rect x="68" y="104" width="82" height="4" rx="2"/>
      <rect x="68" y="118" width="98" height="4" rx="2"/>
      <rect x="68" y="132" width="70" height="4" rx="2"/>
    </g>
    <rect x="68" y="152" width="60" height="8" rx="4" fill="#6a38ff" opacity="0.85"/>
    <rect x="68" y="168" width="40" height="8" rx="4" fill="#1e5bff" opacity="0.5"/>
    <!-- right page: bar chart -->
    <g>
      <rect x="208" y="150" width="16" height="30" rx="3" fill="#c3cbdb"/>
      <rect x="230" y="136" width="16" height="44" rx="3" fill="#1e5bff" opacity="0.55"/>
      <rect x="252" y="118" width="16" height="62" rx="3" fill="#6a38ff"/>
      <rect x="274" y="128" width="16" height="52" rx="3" fill="#00c49a"/>
      <path d="M208 122 L238 108 L262 96 L292 88" fill="none" stroke="#0a1f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
      <circle cx="292" cy="88" r="5" fill="#0a1f44"/>
      <rect x="208" y="188" width="82" height="4" rx="2" fill="#d7dde8"/>
    </g>
  </g>

  <!-- pen -->
  <g transform="rotate(22 300 176)">
    <rect x="256" y="170" width="96" height="9" rx="4.5" fill="#0a1f44"/>
    <path d="M352 170.5 L366 174.5 L352 178.5 Z" fill="#6a38ff"/>
    <rect x="272" y="170" width="16" height="9" fill="#00c49a"/>
  </g>

  <!-- coffee cup -->
  <g>
    <ellipse cx="352" cy="118" rx="30" ry="9" fill="#0a1f44" opacity="0.08"/>
    <path d="M326 62 h52 l-6 52 a20 20 0 0 1 -40 0 Z" fill="#ffffff"/>
    <path d="M326 62 h52 l-2 16 h-48 Z" fill="#6a38ff" opacity="0.16"/>
    <ellipse cx="352" cy="62" rx="26" ry="7" fill="#f7f8fb"/>
    <ellipse cx="352" cy="62" rx="20" ry="5" fill="#8a5a3b"/>
    <path d="M378 74 a16 14 0 0 1 0 26" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
