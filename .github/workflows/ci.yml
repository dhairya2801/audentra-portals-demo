name: Portals CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --workspaces

      - name: Validate temporary contract snapshot
        run: npm --workspace @vv/contracts run typecheck

      - name: Validate portals
        run: |
          npm --workspace @vv/web run typecheck
          npm --workspace @vv/web run lint
          npm --workspace @vv/web test

      # Browser journeys intentionally run outside this job. They require a
      # compatible Audentra Platform environment via E2E_API_BASE_URL.

  # Portal delivery is intentionally CI-only until the authenticated Cloud Run
  # portal-to-platform boundary in docs/architecture/cloud-run-portals-cutover.md
  # is implemented and provisioned. Do not restore the retired VM deployment or
  # point a browser-visible API URL at the IAM-private platform service.
