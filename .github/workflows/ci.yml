name: Portals CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --workspaces

      - name: Validate temporary contract snapshot
        run: npm --workspace @vv/contracts run typecheck

      - name: Validate portals
        run: |
          npm --workspace @vv/web run typecheck
          npm --workspace @vv/web run lint
          npm --workspace @vv/web test

      # Browser journeys intentionally run outside this job. They require a
      # compatible Audentra Platform environment via E2E_API_BASE_URL.
